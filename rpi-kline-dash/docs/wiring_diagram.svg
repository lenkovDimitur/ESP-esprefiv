<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <!-- Arrowhead marker -->
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#E0E0E0"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF4444"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4488FF"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#44CC44"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FFAA00"/>
    </marker>
    <marker id="arrow-bidi" markerWidth="10" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 3.5, 5 0, 10 3.5, 5 7" fill="#FFAA00"/>
    </marker>

    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Glow for power -->
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ Background ═══ -->
  <rect width="1200" height="850" fill="#1A1A2E" rx="12"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" fill="#E8E8E8" font-size="22" font-weight="bold">BMW MS41 K-Line Gauge Cluster — Wiring Diagram</text>
  <text x="600" y="62" text-anchor="middle" fill="#888" font-size="13">Raspberry Pi Zero 2 W  ·  L9637D Transceiver  ·  DS2 Protocol over ISO 9141 K-Line</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- OBD-II CONNECTOR (left side) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="220" height="280" rx="10" fill="#16213E" stroke="#334" stroke-width="2" filter="url(#shadow)"/>
    <!-- Connector shape -->
    <rect x="30" y="20" width="160" height="60" rx="8" fill="#0D1117" stroke="#555" stroke-width="1.5"/>
    <!-- Pin holes row 1 -->
    <g fill="#333" stroke="#666" stroke-width="0.8">
      <circle cx="55" cy="38" r="5"/><text x="55" y="42" text-anchor="middle" fill="#888" font-size="7">1</text>
      <circle cx="75" cy="38" r="5"/><text x="75" y="42" text-anchor="middle" fill="#888" font-size="7">2</text>
      <circle cx="95" cy="38" r="5"/><text x="95" y="42" text-anchor="middle" fill="#888" font-size="7">3</text>
      <circle cx="115" cy="38" r="5" fill="#444" stroke="#888"/><text x="115" y="42" text-anchor="middle" fill="#CCC" font-size="7" font-weight="bold">4</text>
      <circle cx="135" cy="38" r="5" fill="#444" stroke="#888"/><text x="135" y="42" text-anchor="middle" fill="#CCC" font-size="7" font-weight="bold">5</text>
      <circle cx="155" cy="38" r="5"/><text x="155" y="42" text-anchor="middle" fill="#888" font-size="7">6</text>
      <circle cx="170" cy="38" r="5" fill="#553300" stroke="#FFAA00" stroke-width="1.5"/><text x="170" y="42" text-anchor="middle" fill="#FFAA00" font-size="7" font-weight="bold">7</text>
    </g>
    <!-- Pin holes row 2 -->
    <g fill="#333" stroke="#666" stroke-width="0.8">
      <circle cx="65" cy="60" r="5"/><text x="65" y="64" text-anchor="middle" fill="#888" font-size="7">9</text>
      <circle cx="85" cy="60" r="5"/><text x="85" y="64" text-anchor="middle" fill="#888" font-size="7">10</text>
      <circle cx="105" cy="60" r="5"/><text x="105" y="64" text-anchor="middle" fill="#888" font-size="7">14</text>
      <circle cx="125" cy="60" r="5"/><text x="125" y="64" text-anchor="middle" fill="#888" font-size="7">15</text>
      <circle cx="155" cy="60" r="5" fill="#440000" stroke="#FF4444" stroke-width="1.5"/><text x="155" y="64" text-anchor="middle" fill="#FF4444" font-size="7" font-weight="bold">16</text>
    </g>

    <text x="110" y="105" text-anchor="middle" fill="#CCC" font-size="14" font-weight="bold">OBD-II (J1962)</text>

    <!-- Pin descriptions -->
    <g font-size="11" fill="#AAA">
      <rect x="12" y="118" width="196" height="24" rx="4" fill="#0D1117"/>
      <circle cx="24" cy="130" r="5" fill="#440000" stroke="#FF4444" stroke-width="1"/>
      <text x="36" y="134" fill="#FF6666">Pin 16</text>
      <text x="95" y="134" fill="#AAA">+12V Battery (permanent)</text>

      <rect x="12" y="148" width="196" height="24" rx="4" fill="#0D1117"/>
      <circle cx="24" cy="160" r="5" fill="#553300" stroke="#FFAA00" stroke-width="1"/>
      <text x="36" y="164" fill="#FFCC44">Pin 7</text>
      <text x="82" y="164" fill="#AAA">K-Line (ISO 9141)</text>

      <rect x="12" y="178" width="196" height="24" rx="4" fill="#0D1117"/>
      <circle cx="24" cy="190" r="5" fill="#222" stroke="#888" stroke-width="1"/>
      <text x="36" y="194" fill="#999">Pin 4/5</text>
      <text x="92" y="194" fill="#AAA">Chassis / Signal GND</text>
    </g>

    <!-- Car label -->
    <text x="110" y="225" text-anchor="middle" fill="#666" font-size="10">Connects to BMW E36</text>
    <text x="110" y="240" text-anchor="middle" fill="#666" font-size="10">under dashboard</text>

    <!-- BMW Logo placeholder -->
    <circle cx="110" cy="262" r="14" fill="none" stroke="#4488CC" stroke-width="1.5"/>
    <text x="110" y="267" text-anchor="middle" fill="#4488CC" font-size="10" font-weight="bold">BMW</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 12V to 5V BUCK CONVERTER (top center) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(380, 120)">
    <rect x="0" y="0" width="200" height="110" rx="8" fill="#2D1B00" stroke="#885500" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="24" text-anchor="middle" fill="#FFAA44" font-size="13" font-weight="bold">12V → 5V Buck</text>
    <text x="100" y="42" text-anchor="middle" fill="#CC8833" font-size="11">LM2596 Module</text>

    <!-- Input -->
    <rect x="12" y="52" width="80" height="22" rx="4" fill="#1A0D00"/>
    <text x="52" y="67" text-anchor="middle" fill="#FF6666" font-size="11">IN: +12V</text>

    <!-- Output -->
    <rect x="108" y="52" width="80" height="22" rx="4" fill="#1A0D00"/>
    <text x="148" y="67" text-anchor="middle" fill="#44CC44" font-size="11">OUT: +5V</text>

    <!-- GND -->
    <rect x="12" y="80" width="176" height="20" rx="4" fill="#1A0D00"/>
    <text x="100" y="94" text-anchor="middle" fill="#999" font-size="10">GND pass-through</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- L9637D TRANSCEIVER (center) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(380, 310)">
    <rect x="0" y="0" width="220" height="260" rx="10" fill="#1B2A1B" stroke="#336633" stroke-width="2" filter="url(#shadow)"/>

    <!-- IC body -->
    <rect x="40" y="18" width="140" height="80" rx="6" fill="#0D1117" stroke="#448844" stroke-width="1.5"/>
    <circle cx="58" cy="30" r="3" fill="#336633"/>
    <text x="110" y="50" text-anchor="middle" fill="#66CC66" font-size="15" font-weight="bold">L9637D</text>
    <text x="110" y="68" text-anchor="middle" fill="#448844" font-size="10">K-Line Transceiver</text>

    <!-- Pin descriptions -->
    <g font-size="11">
      <rect x="14" y="110" width="192" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="125" fill="#66CC66" font-weight="bold">VCC</text>
      <text x="65" y="125" fill="#AAA">← 5V from buck converter</text>

      <rect x="14" y="137" width="192" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="152" fill="#999" font-weight="bold">GND</text>
      <text x="68" y="152" fill="#AAA">← Common ground</text>

      <rect x="14" y="164" width="192" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="179" fill="#66CC66" font-weight="bold">EN</text>
      <text x="58" y="179" fill="#AAA">← 5V (always enabled)</text>

      <rect x="14" y="191" width="192" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="206" fill="#4488FF" font-weight="bold">TX</text>
      <text x="55" y="206" fill="#AAA">← Pi GPIO14 (UART TX)</text>

      <rect x="14" y="218" width="192" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="233" fill="#44AAFF" font-weight="bold">RX</text>
      <text x="55" y="233" fill="#AAA">→ Pi GPIO15 (UART RX)</text>
    </g>

    <!-- Bypass cap note -->
    <text x="110" y="255" text-anchor="middle" fill="#558855" font-size="9">100nF ceramic bypass on VCC-GND</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- RASPBERRY PI ZERO 2 W (right side) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(720, 270)">
    <rect x="0" y="0" width="260" height="310" rx="10" fill="#1B1B2E" stroke="#4444AA" stroke-width="2" filter="url(#shadow)"/>

    <!-- Board shape -->
    <rect x="20" y="16" width="220" height="130" rx="8" fill="#1A5C1A" stroke="#2A7A2A" stroke-width="1.5"/>
    <!-- CPU -->
    <rect x="100" y="50" width="50" height="50" rx="4" fill="#222" stroke="#555" stroke-width="1"/>
    <text x="125" y="78" text-anchor="middle" fill="#AAA" font-size="8">BCM2710</text>
    <text x="125" y="88" text-anchor="middle" fill="#888" font-size="7">Cortex-A53</text>
    <!-- WiFi chip -->
    <rect x="170" y="30" width="30" height="20" rx="3" fill="#333" stroke="#555" stroke-width="0.8"/>
    <text x="185" y="43" text-anchor="middle" fill="#888" font-size="6">WiFi</text>
    <!-- microSD -->
    <rect x="25" y="110" width="40" height="25" rx="3" fill="#333" stroke="#666" stroke-width="1"/>
    <text x="45" y="126" text-anchor="middle" fill="#999" font-size="7">μSD</text>
    <!-- Mini HDMI port -->
    <rect x="80" y="130" width="30" height="16" rx="2" fill="#444" stroke="#888" stroke-width="1"/>
    <text x="95" y="142" text-anchor="middle" fill="#CCC" font-size="6">HDMI</text>
    <!-- USB power -->
    <rect x="130" y="130" width="24" height="16" rx="2" fill="#444" stroke="#888" stroke-width="1"/>
    <text x="142" y="142" text-anchor="middle" fill="#CCC" font-size="6">μUSB</text>
    <!-- GPIO header -->
    <rect x="25" y="25" width="60" height="12" rx="2" fill="#333" stroke="#FFD700" stroke-width="1"/>
    <text x="55" y="34" text-anchor="middle" fill="#FFD700" font-size="7">GPIO Header</text>

    <text x="130" y="170" text-anchor="middle" fill="#CCC" font-size="14" font-weight="bold">Raspberry Pi Zero 2 W</text>
    <text x="130" y="186" text-anchor="middle" fill="#888" font-size="10">1GHz Quad-Core · 512MB RAM</text>

    <!-- Pin callouts -->
    <g font-size="11">
      <rect x="14" y="198" width="232" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="213" fill="#4488FF" font-weight="bold">GPIO14</text>
      <text x="90" y="213" fill="#AAA">(TX) → L9637D TX input</text>

      <rect x="14" y="224" width="232" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="239" fill="#44AAFF" font-weight="bold">GPIO15</text>
      <text x="90" y="239" fill="#AAA">(RX) ← L9637D RX output</text>

      <rect x="14" y="250" width="232" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="265" fill="#CC88FF" font-weight="bold">HDMI</text>
      <text x="78" y="265" fill="#AAA">→ Waveshare 7" Display</text>

      <rect x="14" y="276" width="232" height="22" rx="4" fill="#0D1117"/>
      <text x="30" y="291" fill="#44CC44" font-weight="bold">5V / GND</text>
      <text x="102" y="291" fill="#AAA">← Power from buck conv.</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- WAVESHARE 7" DISPLAY (bottom right) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(740, 650)">
    <rect x="0" y="0" width="240" height="130" rx="10" fill="#1A1A2E" stroke="#555" stroke-width="2" filter="url(#shadow)"/>
    <!-- Screen -->
    <rect x="15" y="12" width="210" height="85" rx="6" fill="#0D0D0D" stroke="#333" stroke-width="1"/>
    <!-- Gauge preview shapes -->
    <circle cx="75" cy="54" r="28" fill="none" stroke="#FF4500" stroke-width="2" stroke-dasharray="50,30" opacity="0.6"/>
    <circle cx="160" cy="54" r="28" fill="none" stroke="#00BFFF" stroke-width="2" stroke-dasharray="50,30" opacity="0.6"/>
    <line x1="75" y1="54" x2="58" y2="38" stroke="#FF6414" stroke-width="2" opacity="0.8"/>
    <line x1="160" y1="54" x2="178" y2="42" stroke="#FF6414" stroke-width="2" opacity="0.8"/>

    <text x="120" y="115" text-anchor="middle" fill="#CCC" font-size="12" font-weight="bold">Waveshare 7" IPS LCD</text>
    <text x="120" y="128" text-anchor="middle" fill="#888" font-size="10">1024 × 600 · HDMI</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BMW MS41 ECU (bottom left) -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="220" height="150" rx="10" fill="#2E1A1A" stroke="#884444" stroke-width="2" filter="url(#shadow)"/>
    <!-- ECU body -->
    <rect x="20" y="15" width="180" height="70" rx="6" fill="#1A0D0D" stroke="#664444" stroke-width="1.5"/>
    <text x="110" y="42" text-anchor="middle" fill="#FF8888" font-size="14" font-weight="bold">Siemens MS41</text>
    <text x="110" y="58" text-anchor="middle" fill="#AA6666" font-size="10">Motronic DME · M52 Engine</text>
    <text x="110" y="72" text-anchor="middle" fill="#886666" font-size="9">Addr: 0x12 · 9600 baud 8E1</text>

    <g font-size="10" fill="#AA8888">
      <text x="20" y="104">K-Line Pin: OBD-II Pin 7</text>
      <text x="20" y="118">Protocol: BMW DS2</text>
      <text x="20" y="132">30 live parameters @ 10 Hz</text>
      <text x="20" y="146">DTC read / clear</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- WIRING CONNECTIONS -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- +12V: OBD Pin 16 → Buck Converter IN -->
  <path d="M 280 258 L 320 258 L 320 172 L 380 172"
        fill="none" stroke="#FF4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="300" y="200" fill="#FF6666" font-size="10" font-weight="bold" transform="rotate(-90,300,200)">+12V</text>

  <!-- 5V: Buck OUT → L9637D VCC -->
  <path d="M 580 172 L 610 172 L 610 258 L 535 258 L 535 420 L 600 420"
        fill="none" stroke="#44CC44" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="615" y="220" fill="#44CC44" font-size="10" font-weight="bold">5V</text>

  <!-- 5V: Buck OUT → Pi Power -->
  <path d="M 610 172 L 670 172 L 670 555 L 720 555"
        fill="none" stroke="#44CC44" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-green)"/>
  <text x="672" y="400" fill="#44CC44" font-size="9">5V Power</text>

  <!-- K-Line: OBD Pin 7 → L9637D K (via 10k pull-up) -->
  <path d="M 280 320 L 320 320 L 320 400 L 380 400"
        fill="none" stroke="#FFAA00" stroke-width="2.5" marker-end="url(#arrow-yellow)"/>
  <!-- 10k pull-up resistor symbol -->
  <rect x="305" y="280" width="30" height="14" rx="3" fill="none" stroke="#FFAA00" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" fill="#FFAA00" font-size="8">10kΩ</text>
  <line x1="320" y1="258" x2="320" y2="280" stroke="#FFAA00" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="320" y1="294" x2="320" y2="320" stroke="#FFAA00" stroke-width="1"/>
  <text x="345" y="365" fill="#FFCC44" font-size="10" font-weight="bold">K-Line</text>

  <!-- K-Line: L9637D K → MS41 ECU (same wire, going down) -->
  <path d="M 380 400 L 340 400 L 340 580 L 280 580"
        fill="none" stroke="#FFAA00" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="310" y="500" fill="#FFCC44" font-size="9" transform="rotate(-90,310,500)">K-Line Bus</text>

  <!-- UART TX: Pi GPIO14 → L9637D TX -->
  <path d="M 720 487 L 660 487 L 660 502 L 600 502"
        fill="none" stroke="#4488FF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="660" y="497" text-anchor="middle" fill="#4488FF" font-size="9" font-weight="bold">TX (3.3V)</text>

  <!-- UART RX: L9637D RX → Pi GPIO15 -->
  <path d="M 600 530 L 660 530 L 660 513 L 720 513"
        fill="none" stroke="#44AAFF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="660" y="545" text-anchor="middle" fill="#44AAFF" font-size="9" font-weight="bold">RX (3.3V)</text>

  <!-- GND: OBD → all components -->
  <path d="M 280 350 L 330 350 L 330 610 L 490 610"
        fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 490 610 L 490 560 L 490 460 L 465 460"
        fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 490 610 L 720 610 L 720 570"
        fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="490" y="625" text-anchor="middle" fill="#888" font-size="10">Common GND</text>

  <!-- HDMI: Pi → Display -->
  <path d="M 850 540 L 850 600 L 860 650"
        fill="none" stroke="#CC88FF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="830" y="620" fill="#CC88FF" font-size="10" font-weight="bold">HDMI</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(60, 720)">
    <rect x="0" y="0" width="500" height="110" rx="8" fill="#111122" stroke="#333" stroke-width="1"/>
    <text x="15" y="22" fill="#CCC" font-size="12" font-weight="bold">Wire Legend</text>

    <line x1="15" y1="40" x2="55" y2="40" stroke="#FF4444" stroke-width="2.5"/>
    <text x="65" y="44" fill="#AAA" font-size="11">+12V (from OBD-II Pin 16)</text>

    <line x1="15" y1="58" x2="55" y2="58" stroke="#44CC44" stroke-width="2"/>
    <text x="65" y="62" fill="#AAA" font-size="11">+5V (regulated output)</text>

    <line x1="15" y1="76" x2="55" y2="76" stroke="#FFAA00" stroke-width="2.5"/>
    <text x="65" y="80" fill="#AAA" font-size="11">K-Line (ISO 9141, 12V signaling)</text>

    <line x1="250" y1="40" x2="290" y2="40" stroke="#4488FF" stroke-width="2"/>
    <text x="300" y="44" fill="#AAA" font-size="11">UART TX/RX (3.3V logic)</text>

    <line x1="250" y1="58" x2="290" y2="58" stroke="#CC88FF" stroke-width="2.5"/>
    <text x="300" y="62" fill="#AAA" font-size="11">HDMI video output</text>

    <line x1="250" y1="76" x2="290" y2="76" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="300" y="80" fill="#AAA" font-size="11">Ground (common)</text>

    <text x="15" y="100" fill="#666" font-size="9">L9637D handles 3.3V ↔ 12V level shifting. Pi UART operates at 3.3V; K-Line bus runs at 12V.</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PROTOCOL INFO BOX -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <g transform="translate(620, 720)">
    <rect x="0" y="0" width="340" height="110" rx="8" fill="#111122" stroke="#333" stroke-width="1"/>
    <text x="15" y="22" fill="#CCC" font-size="12" font-weight="bold">Communication Protocol</text>

    <g font-size="11" fill="#AAA">
      <text x="15" y="42">K-Line: 9600 baud, 8 data, Even parity, 1 stop</text>
      <text x="15" y="58">Init: Fast (25ms LOW/HIGH) or Slow (5-baud)</text>
      <text x="15" y="74">Frame: [Addr=0x12] [Len] [Payload] [XOR Chk]</text>
      <text x="15" y="90">Polling: 10 Hz (30 live parameters)</text>
      <text x="15" y="106" fill="#666">Half-duplex: TX echoes on RX, must discard</text>
    </g>
  </g>

</svg>
